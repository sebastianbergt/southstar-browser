[package]
name = "southstar-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "LicenseRef-NSL-1.0 OR GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
southstar-html5 = { path = "../rust/html5" }
southstar-url = { path = "../rust/url" }
southstar-http-wire = { path = "../rust/http-wire" }
southstar-css-syntax = { path = "../rust/css-syntax" }
southstar-css = { path = "../rust/css" }
southstar-css-color = { path = "../rust/css-color" }
southstar-css-prop-syntax = { path = "../rust/css-prop-syntax" }
southstar-selector-text = { path = "../rust/selector-text" }
southstar-xml = { path = "../rust/xml" }
southstar-woff2 = { path = "../rust/woff2" }
southstar-raster = { path = "../rust/raster" }
southstar-image-decoders = { path = "../rust/image-decoders" }
southstar-http = { path = "../rust/http" }
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
southstar-plmpeg = { path = "../rust/plmpeg" }
southstar-minimp3 = { path = "../rust/minimp3" }
southstar-bidi = { path = "../rust/bidi" }
southstar-webvtt = { path = "../rust/webvtt" }
southstar-csp = { path = "../rust/csp" }
southstar-mime = { path = "../rust/mime" }
southstar-netstore = { path = "../rust/netstore" }
southstar-ipc = { path = "../rust/ipc" }
southstar-svg = { path = "../rust/svg" }
southstar-websocket = { path = "../rust/websocket" }
southstar-eventsource = { path = "../rust/eventsource" }
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "auto-dispatch", "portable-dispatch"] }
read-fonts = "0.46"
skrifa = "0.49"
harfrust = "0.15"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "0.17.14", default-features = false }
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.8", default-features = false }
boa_engine = { package = "southstar-boa-engine", path = "../third_party/boa_engine", features = ["annex-b", "experimental"] }

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "html5_document"
path = "fuzz_targets/html5_document.rs"
test = false
doc = false
bench = false

